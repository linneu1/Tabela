<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Banco da Turma 🪙 - Aprendendo Gráficos</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #0f172a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: manipulation;
    }

    #game-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 460px;
      max-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px;
    }

    #game-wrapper:fullscreen,
    #game-wrapper:-webkit-full-screen {
      max-width: 100vw;
      max-height: 100vh;
      padding: 12px;
      background: #0f172a;
    }

    /* Área do Gráfico (Canvas) */
    .canvas-container {
      position: relative;
      width: 100%;
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0;
    }

    canvas {
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      image-rendering: pixelated;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 320 / 220;
      object-fit: contain;
    }

    /* Área da Tabela e Painel */
    .controls-panel {
      width: 100%;
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 6px;
      margin-top: 6px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .panel-title {
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #38bdf8;
    }

    .reset-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Estilo da Tabela de Dados */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    .data-table th, .data-table td {
      padding: 4px 6px;
      text-align: center;
      border-bottom: 1px solid #334155;
    }

    .data-table th {
      background: #0f172a;
      color: #94a3b8;
      font-size: 10px;
      text-transform: uppercase;
    }

    .student-cell {
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: bold;
      text-align: left;
    }

    .color-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .money-text {
      font-weight: bold;
      color: #10b981;
      font-family: monospace;
      font-size: 12px;
    }

    .btn-coin {
      background: #f59e0b;
      color: #000;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 0 #b45309;
      transition: transform 0.05s;
      touch-action: manipulation;
    }

    .btn-coin:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .fullscreen-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.8);
      color: #38bdf8;
      border: 1px solid #38bdf8;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <button class="fullscreen-btn" onclick="toggleFullScreen()">⛶ Tela Cheia</button>

    <!-- Gráfico Visual -->
    <div class="canvas-container">
      <canvas id="gameCanvas" width="320" height="220"></canvas>
    </div>
    
    <!-- Tabela de Controle -->
    <div class="controls-panel">
      <div class="panel-header">
        <span class="panel-title">📊 Tabela de Valores (R$)</span>
        <button class="reset-btn" onclick="resetData()">Zerar Tudo</button>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th style="text-align: left;">Pessoa</th>
            <th>Total</th>
            <th>Doar R$ 5</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Dados das Pessoas
    const people = [
      { name: 'Yasmin', amount: 10, color: '#ec4899' },
      { name: 'Gregório', amount: 15, color: '#ef4444' },
      { name: 'Frederico', amount: 5, color: '#3b82f6' },
      { name: 'Kauê', amount: 20, color: '#10b981' },
      { name: 'Maria', amount: 10, color: '#a855f7' },
      { name: 'Agatha', amount: 15, color: '#f59e0b' },
      { name: 'Prof. William', amount: 25, color: '#06b6d4' }
    ];

    const tableBody = document.getElementById('tableBody');

    function renderTable() {
      tableBody.innerHTML = '';
      people.forEach((p, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>
            <div class="student-cell">
              <span class="color-dot" style="background: ${p.color}"></span>
              <span>${p.name}</span>
            </div>
          </td>
          <td class="money-text">R$ ${p.amount}</td>
          <td>
            <button class="btn-coin" onclick="addMoney(${index}, 5)">+ R$ 5</button>
          </td>
        `;
        tableBody.appendChild(tr);
      });
    }

    function addMoney(index, value) {
      people[index].amount += value;
      renderTable();
    }

    function resetData() {
      people[0].amount = 10;
      people[1].amount = 15;
      people[2].amount = 5;
      people[3].amount = 20;
      people[4].amount = 10;
      people[5].amount = 15;
      people[6].amount = 25;
      renderTable();
    }

    function gameLoop() {
      renderGraph();
      requestAnimationFrame(gameLoop);
    }

    function renderGraph() {
      // Fundo do Gráfico
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Título do Gráfico
      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('GRÁFICO DE BARRAS: QUEM TEM MAIS DINHEIRO?', canvas.width / 2, 18);

      // Descobrir maior valor para ajustar escala do gráfico
      const maxAmount = Math.max(...people.map(p => p.amount), 30);

      // Linhas Guia Horizontais (Eixo Y)
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1;
      const gridSteps = 4;
      for (let i = 0; i <= gridSteps; i++) {
        const val = Math.round((maxAmount / gridSteps) * i);
        const y = 180 - (i * (140 / gridSteps));
        
        ctx.beginPath();
        ctx.moveTo(35, y);
        ctx.lineTo(310, y);
        ctx.stroke();

        ctx.fillStyle = '#64748b';
        ctx.font = '8px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(`R$${val}`, 30, y + 3);
      }

      // Desenhar as Barras (Eixo X)
      const startX = 42;
      const barWidth = 26;
      const gap = 12;

      people.forEach((p, index) => {
        const x = startX + index * (barWidth + gap);
        const barHeight = (p.amount / maxAmount) * 140;
        const y = 180 - barHeight;

        // Barra
        ctx.fillStyle = p.color;
        ctx.fillRect(x, y, barWidth, barHeight);

        // Borda da Barra
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        ctx.strokeRect(x, y, barWidth, barHeight);

        // Valor no topo da barra
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 8px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`R$${p.amount}`, x + barWidth / 2, y - 4);

        // Nome / Inicial abaixo do Eixo
        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 8px sans-serif';
        // Exibe apelido curto caso seja o professor
        const shortName = p.name === 'Prof. William' ? 'Prof.W' : p.name.substring(0, 4);
        ctx.fillText(shortName, x + barWidth / 2, 194);
      });
    }

    function toggleFullScreen() {
      const elem = document.getElementById('game-wrapper');
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (elem.requestFullscreen) elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    renderTable();
    gameLoop();
  </script>
</body>
</html>
